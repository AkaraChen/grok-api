[package]
name = "grok-api"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "CLI for the Grok / xAI API"
repository = "https://github.com/AkaraChen/grok-api"
readme = "README.md"
keywords = ["grok", "xai", "image", "video", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "grok-api"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking", "stream"] }
rmcp = { version = "3", default-features = false, features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "fs", "process", "io-std", "io-util", "net", "signal"] }
toml = "0.8"
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }

# Official Grok Build crates, pinned to a main commit.
xai-dirs = { git = "https://github.com/xai-org/grok-build", rev = "bc7f02eddd3d84085849dc19ed216f11c23b0571", package = "xai-dirs" }
xai-grok-auth = { git = "https://github.com/xai-org/grok-build", rev = "bc7f02eddd3d84085849dc19ed216f11c23b0571", package = "xai-grok-auth" }
xai-grok-env = { git = "https://github.com/xai-org/grok-build", rev = "bc7f02eddd3d84085849dc19ed216f11c23b0571", package = "xai-grok-env" }
xai-grok-paths = { git = "https://github.com/xai-org/grok-build", rev = "bc7f02eddd3d84085849dc19ed216f11c23b0571", package = "xai-grok-paths" }
# xai-grok-tools pulls xai-grok-tools-api, whose build.rs needs the
# grok-build monorepo's vendored protoc/dotslash. Pin the library crates
# above instead and call the same Imagine HTTP API those tools use.

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
